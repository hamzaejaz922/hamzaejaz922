<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050b08"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="none" stroke="#123a24" stroke-width="1.5"/>

  <!-- decorative dots -->
  <circle cx="70" cy="40" r="3" fill="#39FF14" opacity="0.7"/>
  <circle cx="830" cy="55" r="2.5" fill="#39FF14" opacity="0.5"/>
  <circle cx="810" cy="170" r="3" fill="#39FF14" opacity="0.6"/>
  <circle cx="60" cy="180" r="2" fill="#39FF14" opacity="0.5"/>
  <circle cx="450" cy="20" r="1.8" fill="#39FF14" opacity="0.4"/>

  <!-- name -->
  <text x="450" y="105" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-weight="bold"
        font-size="46" fill="#39FF14" filter="url(#glow)" letter-spacing="2">MUHAMMAD HAMZA</text>

  <!-- thin divider -->
  <rect x="330" y="128" width="240" height="2.5" rx="1.5" fill="#39FF14" opacity="0.85"/>

  <!-- subtitle -->
  <text x="450" y="160" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-size="17"
        fill="#8CFFB0">Full Stack Dev Intern · Aspiring AI App Developer</text>

  <text x="450" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="14"
        fill="#4fae74">Building Digital Experiences</text>
</svg>
