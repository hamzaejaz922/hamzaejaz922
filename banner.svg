<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#58A6FF" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dotglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="600" height="300" fill="url(#fade)"/>

  <circle cx="980" cy="70" r="10" fill="url(#dotglow)"/>
  <circle cx="1090" cy="150" r="6" fill="url(#dotglow)"/>
  <circle cx="640" cy="230" r="7" fill="url(#dotglow)"/>
  <circle cx="1140" cy="60" r="5" fill="url(#dotglow)"/>
  <circle cx="850" cy="230" r="4" fill="#58A6FF" opacity="0.5"/>

  <text x="60" y="130" font-family="Consolas, monospace" font-size="58" font-weight="700" fill="#f4f6f8" filter="url(#glow)">MUHAMMAD HAMZA</text>

  <text x="62" y="175" font-family="Consolas, monospace" font-size="21" fill="#39D353">Full Stack Dev &#8226; AI &#8226; Cybersecurity &#8226; BSCS @ COMSATS</text>

  <text x="62" y="225" font-family="Consolas, monospace" font-size="17" fill="#58A6FF">Initializing profile<tspan fill="#8b949e">...</tspan></text>
  <rect x="330" y="211" width="10" height="18" fill="#39D353">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="255" x2="1140" y2="255" stroke="#21262d" stroke-width="1"/>

  <text x="62" y="280" font-family="Consolas, monospace" font-size="14" fill="#58A6FF">SYSTEM STATUS :: ONLINE</text>
  <text x="1140" y="280" font-family="Consolas, monospace" font-size="14" fill="#39D353" text-anchor="end">github.com/hamzaejaz922</text>
</svg>
