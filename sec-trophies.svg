<svg width="1200" height="86" viewBox="0 0 1200 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#58A6FF" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0B72F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0B72F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="86" fill="url(#bg)"/>
  <rect width="1200" height="86" fill="url(#grid)"/>
  <circle cx="1130" cy="24" r="7" fill="url(#dot)">
    <animate attributeName="cx" values="1130;1080;1130" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="24;40;24" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="60" r="4" fill="#F0B72F" opacity="0.55">
    <animate attributeName="cx" values="1000;950;1000" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="52" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#f4f6f8" filter="url(#glow)">&#127942; GitHub Trophies</text>
  <line x1="40" y1="70" x2="200" y2="70" stroke="#F0B72F" stroke-width="2"/>
</svg>
